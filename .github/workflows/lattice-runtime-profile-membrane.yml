name: lattice-runtime-profile-membrane

on:
  pull_request:
    paths:
      - "fixtures/lattice/lattice-runtime-profile-membrane/**"
      - "scripts/validate_lattice_runtime_profile_membrane.py"
      - ".github/workflows/lattice-runtime-profile-membrane.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-lattice-runtime-profile-membrane:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Lattice runtime profile membrane fixture
        run: python scripts/validate_lattice_runtime_profile_membrane.py
